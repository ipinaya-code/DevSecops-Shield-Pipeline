# OWASP ZAP Baseline Configuration
# Configuración básica para escaneo DAST automático

# Habilitar scan activo
scanpolicy.active=true

# Configuración de proxy
proxy.ip=127.0.0.1
proxy.port=8080

# Reporte
report.type=html
report.format=medium

# Configuración de timeout
connection.timeout=30000

# Nivel de detalle
report.level=medium

# Configuración de scan
context.name=Default Context
context.include=.*
context.exclude=

# Escaneo de AJAX
ajax.spider.enabled=true

# Escaneo de spiders
spider.duration=5

# Escaneo activo
scan.maxresults=50
